server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single page app: let react-router handle unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Files that point to the current build must always be revalidated, otherwise
    # browsers keep loading the previous build after a redeploy.
    # (index.html is also served for every app route through try_files above)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The service worker must never be cached, otherwise updates won't reach users
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~ ^/(asset-manifest\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets (JS, CSS, fonts) get a new name on every build, so they can be cached forever
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
