<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Learn Kana – Practice Hiragana, Katakana, Kanji &amp; Japanese Sentences</title>
  <meta name="description" content="Free Japanese practice in your browser: hiragana and katakana drills, N5 / N4 kanji with spaced repetition, 700+ beginner words and 1,200+ JLPT N5 / N4 sentences. Type the romaji, track your progress, works offline. In English and Indonesian." />
  <meta name="keywords" content="hiragana, katakana, kana, kanji, learn Japanese, Japanese practice, JLPT N5, JLPT N4, romaji, belajar bahasa Jepang" />
  <meta name="theme-color" content="#155263" />
  <link rel="icon" href="%PUBLIC_URL%/icon.png" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Link previews (Facebook, WhatsApp, X...). The canonical address,
       og:url and the absolute og:image are added at build time when SITE_URL
       is set (scripts/seo-postbuild.mjs): they need the public address. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Learn Kana" />
  <meta property="og:title" content="Learn Kana – Practice Hiragana, Katakana, Kanji &amp; Japanese Sentences" />
  <meta property="og:description" content="Hiragana and katakana drills, N5 / N4 kanji reviews, beginner words and 1,200+ JLPT N5 / N4 sentences. Free, in the browser, works offline." />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="id_ID" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Learn Kana – Practice Hiragana, Katakana, Kanji &amp; Japanese Sentences" />
  <meta name="twitter:description" content="Hiragana and katakana drills, N5 / N4 kanji reviews, beginner words and 1,200+ JLPT N5 / N4 sentences. Free, in the browser, works offline." />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Learn Kana",
      "description": "Free Japanese practice in the browser: hiragana and katakana drills, N5 / N4 kanji with spaced repetition, beginner words and JLPT N5 / N4 sentences.",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Any (web browser)",
      "inLanguage": ["en", "id"],
      "isAccessibleForFree": true,
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "educationalLevel": "Beginner",
      "teaches": ["Hiragana", "Katakana", "Kanji", "Japanese vocabulary", "Japanese grammar (JLPT N5, N4)"]
    }
  </script>

  <script>
    // Dark theme before the first paint, so it doesn't flash light while the app loads
    try {
      if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
    } catch (error) { }
  </script>
  <style>
    /* Shown until the app starts (React replaces #root's content), and what
       crawlers that don't run JavaScript read */
    body { margin: 0; background-color: #155263; color: #ff9a3c; }
    html[data-theme='dark'] body { background-color: #2a373d; }
    .app-intro { max-width: 40em; margin: 0 auto; padding: 18vh 1.5em 0; text-align: center; font-family: "Trebuchet MS", sans-serif; }
    .app-intro h1 { margin: 0 0 0.4em; font-size: 2.2em; }
    .app-intro p { margin: 0; line-height: 1.5; opacity: 0.85; }
  </style>
  <!-- Umami analytics is added by src/analytics.js when configured in .env -->
</head>

<body>
  <div id="root">
    <main class="app-intro">
      <h1>Learn Kana</h1>
      <p>Practice hiragana, katakana, N5 / N4 kanji, beginner words and JLPT N5 / N4 Japanese sentences right in your browser. Pick the characters you want, type the romaji, and track your progress — free, offline, in English and Indonesian.</p>
    </main>
  </div>
  <noscript>
    <p style="text-align: center">Learn Kana needs JavaScript to run. Please enable it to practice.</p>
  </noscript>
</body>

</html>
